[package]
name = "sturdy-carnival"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = [ "runtime-tokio-native-tls", "mysql", "json"] }
dotenvy = "0.15.7"
rss = "2.1.0"
regex = "1.13.1"
urlencoding = "2.1.3"
clap = { version = "4.6.5", features = ["derive"] }
